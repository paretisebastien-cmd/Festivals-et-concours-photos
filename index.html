const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'):m+' min';
[...new Set(D.map(x=>x.theme))].sort().forEach(t=>q('#th').insertAdjacentHTML('beforeend','<option>'+e(t)+'</option>'));
let view='list',range='60';
function items(){const k=q('#k').value,th=q('#th').value,py=q('#pay').value,mn=q('#mn').value,inv=q('#inv').checked,dn=q('#dn').checked;
return D.filter(x=>(k==='all'||(k==='contest')===(x.kind==='contest'))&&(th==='all'||x.theme===th)&&(py==='all'||x.kind!=='contest'||x.pay===py)&&(mn==='all'||x.kind==='contest'||x.mins==null||x.mins<=+mn)&&!(inv&&x.inv)&&!(dn&&['Envoyé','Accepté','Refusé'].includes(st[x.id]))).sort((a,b)=>{const pa=a.n==null?2:a.n<0?1:0,pb=b.n==null?2:b.n<0?1:0;return pa-pb||(a.n-b.n)||0})}
function badge(x){if(x.n==null)return['En cours / à venir','ok'];if(x.n<0)return['Clôture passée','late'];return x.n<=7?['Urgent','urg']:x.n<=30?['Ce mois-ci','mid']:['Ouvert','ok']}
const fiche=x=>{const f=x.fiche;if(!f)return'';const r=[];
r.push(['Photos max',f.max+(f.cat&&f.cat!==f.max?' (par catégorie : '+f.cat+')':'')]);
if(f.px)r.push(['Taille des fichiers',f.px==='Max'?'Taille maximale (non précisée)':f.px.replace('min','min.').replace('max','max.')]);
r.push(['Frais',f.pay==='Non'?'Gratuit':f.pay]);
if(f.multi)r.push(['Exposition multiple',f.multi==='?'?'Non précisé':f.multi]);
return '<details><summary>Fiche pratique</summary><dl>'+r.map(a=>'<dt>'+e(a[0])+'</dt><dd>'+e(a[1])+'</dd>').join('')+'</dl></details>'};
function card(x){const[b,c]=badge(x),s=st[x.id]||'À faire';
const dd=x.d?(x.kind==='contest'?'Clôture vers le ':'Candidature jusqu’au ~')+fd(x.d)+(x.n>=0?' (J-'+x.n+')':''):e(x.when);
return '<li class="card"><div class="top"><h3>'+e(x.name)+'</h3><span class="b '+c+'">'+b+'</span></div><p class="meta">'+e(x.meta)+'</p>'+(x.mins!=null?'<p class="km">≈ '+hm(x.mins)+' en voiture depuis Sens</p>':'')+'<p class="d">'+dd+'</p>'+(x.rem?'<p class="rem">'+e(x.rem)+'</p>':'')+fiche(x)+'<div class="row">'+(x.url?'<a href="'+e(x.url)+'" target="_blank" rel="noopener">Site officiel ↗</a>':'')+(x.route?'<a href="'+e(x.route)+'" target="_blank" rel="noopener">Itinéraire ↗</a>':'')+'<select data-id="'+e(x.id)+'" aria-label="Statut">'+ST.map(t=>'<option'+(t===s?' selected':'')+'>'+t+'</option>').join('')+'</select></div></li>'}
function render(){const L=items();q('#cnt').textContent=L.length+' résultat'+(L.length>1?'s':'');
if(view==='list'){q('#ul').innerHTML=L.map(card).join('')||'<li class="sub">Aucun résultat avec ces filtres.</li>'}else{
let F=L.filter(x=>x.n!=null&&x.n>=0);if(range==='60')F=F.filter(x=>x.n<=60);const mx=range==='60'?60:Math.max(1,...F.map(x=>x.n));
q('#end').textContent=fd(new Date(T.getTime()+mx*864e5));
q('#fr').innerHTML=F.map(x=>'<div class="fr"><div class="fl"><b>'+e(x.name)+'</b><span>'+fd(x.d)+' · '+(x.n===0?'aujourd’hui':'J-'+x.n)+(st[x.id]?' · '+e(st[x.id]):'')+'</span></div><div class="ft"><i class="'+x.kind+'" style="width:'+Math.max(3,Math.round(x.n/mx*100))+'%"></i></div></div>').join('')||'<p class="sub">Rien à afficher sur cette période.</p>'}}
function setView(v){view=v;q('#listv').hidden=v!=='list';q('#frv').hidden=v==='list';q('#tl').setAttribute('aria-pressed',v==='list');q('#tf').setAttribute('aria-pressed',v!=='list');render()}
q('#tl').onclick=()=>setView('list');q('#tf').onclick=()=>setView('frise');
q('#r60').onclick=()=>{range='60';q('#r60').setAttribute('aria-pressed',true);q('#rall').setAttribute('aria-pressed',false);render()};
q('#rall').onclick=()=>{range='all';q('#rall').setAttribute('aria-pressed',true);q('#r60').setAttribute('aria-pressed',false);render()};
document.querySelectorAll('.fil select,.fil input').forEach(i=>i.onchange=render);
document.addEventListener('change',ev=>{const id=ev.target.dataset&&ev.target.dataset.id;if(id){st[id]=ev.target.value;save();render()}});
render();if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
