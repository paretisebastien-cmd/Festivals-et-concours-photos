<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Déclic · concours et festivals photo nature</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffffff"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><style>:root{--bg:#f7f7f8;--sf:#fff;--ink:#15161a;--mut:#6b6f76;--line:#e6e7ea;--red:#e63b2e;--soft:#efeff1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;font-family:"Avenir Next","Segoe UI Variable Display","SF Pro Display",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101114;--sf:#17181c;--ink:#f1f1f3;--mut:#9a9ea6;--line:#272a30;--soft:#1f2126;--red:#ff5a4d;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}main{max-width:680px;margin:0 auto;padding:22px 18px calc(96px + env(safe-area-inset-bottom,0px))}
.brand{justify-content:space-between;display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.03em;font-size:1.1rem;margin-bottom:22px}.brand i{width:11px;height:11px;border-radius:50%;background:var(--red);display:block}
h1{font-size:2.1rem;font-weight:300;letter-spacing:-.035em;line-height:1.1;margin:0 0 4px}h2.s{font-size:.95rem;font-weight:650;margin:30px 0 12px;color:var(--mut)}.lead{color:var(--mut);margin:0 0 22px}
.hero{background:var(--sf);border:1px solid var(--line);border-radius:24px;padding:24px 22px;margin-bottom:14px}.big{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}.big b{font-size:5.2rem;font-weight:200;letter-spacing:-.06em;line-height:.9;color:var(--red);font-variant-numeric:tabular-nums}.big span{color:var(--mut)}.hero h2{font-size:1.35rem;font-weight:650;letter-spacing:-.02em;margin:0 0 6px;line-height:1.25}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.tag{font-size:.78rem;color:var(--mut);font-weight:600}
.cd{font-size:.85rem;color:var(--mut)}.cd b{font-size:1.15rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}.cd.hot b{color:var(--red)}.cd.run{color:#1f8a5f;font-weight:650}
h3{font-size:1.1rem;font-weight:650;letter-spacing:-.015em;margin:0;line-height:1.28}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{font-size:.76rem;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut)}.chip.go{color:var(--ink);font-weight:650}
.d{margin:2px 0;font-size:.92rem;font-weight:600}.rem{margin:8px 0 0;font-size:.82rem;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.btn,.lnk{font:inherit;font-size:.85rem;font-weight:650;border-radius:99px;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}.row select{font:inherit;font-size:.85rem;padding:8px 10px;border-radius:99px;border:1px solid var(--line);background:var(--sf);color:var(--ink);margin-left:auto}
details{margin-top:10px;font-size:.88rem}summary{cursor:pointer;font-weight:650}dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:10px 0 2px}dt{color:var(--mut)}dd{margin:0;font-weight:600}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:0 0 12px}.seg button{flex:1;font:inherit;font-size:.9rem;font-weight:650;border:0;background:transparent;color:var(--mut);padding:8px;border-radius:9px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.srch{width:100%;box-sizing:border-box;font:inherit;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);margin-bottom:12px}.rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -18px 14px;padding-left:18px;padding-right:18px;scrollbar-width:none}.rail button{flex:none;font:inherit;font-size:.85rem;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer}.rail button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:36px 10px}.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}.nav div{display:flex;width:100%;max-width:680px}.nav button{flex:1;font:inherit;font-size:.78rem;font-weight:650;border:0;background:transparent;color:var(--mut);padding:12px 4px 14px;cursor:pointer}.nav button[aria-current=page]{color:var(--ink);box-shadow:inset 0 2px 0 var(--red)}
.btn:focus-visible,.lnk:focus-visible,.nav button:focus-visible,.rail button:focus-visible,.seg button:focus-visible,.srch:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}dialog{box-sizing:border-box;border:0;border-radius:24px;padding:22px;width:min(92vw,460px);background:var(--sf);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.45)}dialog h2{font-size:1.4rem;font-weight:400;letter-spacing:-.02em;margin:0 0 6px}.pick{display:block;width:100%;text-align:left;margin:6px 0}.f{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px}dialog .srch{margin:0}.note{font-size:.75rem;color:var(--mut);margin-top:26px}</style></head><body><main><div class="brand"><span style="display:flex;align-items:center;gap:8px"><i></i>Déclic</span><button class="btn" id="cityb" data-city="1">Choisir ma ville</button></div><div id="m"></div></main><dialog id="dc"><form method="dialog"><h2>Où partez-vous ?</h2><p class="lead" style="margin-bottom:12px">Votre ville sert à estimer le temps de route vers les festivals. Elle reste sur votre téléphone.</p><input class="srch" id="ci" placeholder="Votre ville" autocomplete="off" aria-label="Votre ville"><div id="cl"></div><div class="row"><button class="btn" value="skip">Passer</button></div></form></dialog>
<dialog id="dp"><h2>Proposer un concours</h2><p class="lead" style="margin-bottom:4px">Dites-nous ce qui manque, nous vérifions avant d’ajouter.</p>
<label class="f" for="pn">Nom</label><input class="srch" id="pn"><label class="f" for="pt">Type</label><select class="srch" id="pt"><option>Concours</option><option>Festival</option></select>
<label class="f" for="pu">Site web</label><input class="srch" id="pu" type="url" placeholder="https://"><label class="f" for="pd">Date limite</label><input class="srch" id="pd" type="date">
<label class="f" for="pth">Thème</label><input class="srch" id="pth" placeholder="Oiseaux, macro, paysage…"><label class="f" for="pp">Prix d’inscription</label><input class="srch" id="pp" placeholder="Gratuit ou montant"><label class="f" for="pr">Remarques</label><input class="srch" id="pr">
<div class="row"><button class="btn pri" data-send="1" type="button">Envoyer</button><button class="btn" data-close="1" type="button">Annuler</button></div></dialog><nav class="nav" aria-label="Navigation"><div><button data-t="week" aria-current="page">Cette semaine</button><button data-t="disc">Découvrir</button><button data-t="mine">Mes candidatures</button></div></nav><script>let D=[],CFG={},home=null;try{home=JSON.parse(localStorage.getItem("dc-home")||"null")}catch(x){}
const q=s=>document.querySelector(s),MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],ST=['Pas suivi','À faire','Préparé','Envoyé','Accepté','Refusé'],DONE=['Envoyé','Accepté','Refusé'];
let st={};try{st=JSON.parse(localStorage.getItem('fp-status')||'{}')}catch(x){}
const save=()=>{try{localStorage.setItem('fp-status',JSON.stringify(st))}catch(x){}};
const T=new Date();T.setHours(0,0,0,0);
const rad=Math.PI/180,crowKm=(a,b,c,d)=>{const h=Math.sin((c-a)*rad/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin((d-b)*rad/2)**2;return 6371*2*Math.asin(Math.sqrt(h))};
function prep(){D.forEach(x=>{x.d=x.dl?new Date(x.dl+'T00:00:00'):null;x.n=x.d?Math.round((x.d-T)/864e5):null;x.mins=null;x.route='';
if(home&&x.lat!=null){const k=crowKm(home.lat,home.lon,x.lat,x.lon),r=k*(k<60?1.3:1.22),v=r<100?70:r<300?80:95,dp=(x.meta.match(/\((\d\d)\)/)||[])[1]||'',f=['74','38','05','65','01','39','25','73','12','48','15'].includes(dp)?1.1:1;x.mins=Math.max(15,Math.round(r/v*f*4)*15);
x.route='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(home.name+', France')+'&destination='+encodeURIComponent(x.city+', France')+'&travelmode=driving'}});
const b=q('#cityb');if(b)b.textContent=home?home.name:'Choisir ma ville'}
const fd=d=>d.getDate()+' '+MO[d.getMonth()]+(d.getFullYear()!==T.getFullYear()?' '+d.getFullYear():'');
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'):m+' min';
const S=x=>st[x.id]||'Pas suivi',uni=a=>[...new Set(a)];
const tag=x=>x.kind==='contest'?'Concours':x.kind==='festival'?'Candidature festival':'Festival en cours';
const cd=x=>x.n==null?'<span class="cd run">en cours</span>':x.n<0?'<span class="cd">terminé</span>':'<span class="cd'+(x.n<=7?' hot':'')+'"><b>'+x.n+'</b> '+(x.n<=1?'jour':'jours')+'</span>';
const chips=x=>x.meta.split(' · ').map(c=>'<span class="chip">'+e(c)+'</span>').join('')+(x.mins!=null?'<span class="chip go">'+hm(x.mins)+' de route</span>':'');
const dd=x=>x.d?(x.kind==='contest'?'Clôture vers le ':'Candidature jusqu’au ~')+fd(x.d):e(x.when);
const fiche=x=>{const f=x.fiche;if(!f)return'';const r=[];
r.push(['Photos max',f.max+(f.cat&&f.cat!==f.max?' (par catégorie : '+f.cat+')':'')]);
if(f.px)r.push(['Taille des fichiers',f.px==='Max'?'Taille maximale (non précisée)':f.px.replace('min','min.').replace('max','max.')]);
r.push(['Frais',f.pay==='Non'?'Gratuit':f.pay]);
if(f.multi)r.push(['Exposition multiple',f.multi==='?'?'Non précisé':f.multi]);
return '<details><summary>Fiche pratique</summary><dl>'+r.map(a=>'<dt>'+e(a[0])+'</dt><dd>'+e(a[1])+'</dd>').join('')+'</dl></details>'};

const acts=x=>'<div class="row">'+(x.d&&x.n>=0?'<button class="btn" data-ics="'+e(x.id)+'">Rappel</button>':'')+(x.url?'<a class="lnk" href="'+e(x.url)+'" target="_blank" rel="noopener">Site officiel</a>':'')+(x.route?'<a class="lnk" href="'+e(x.route)+'" target="_blank" rel="noopener">Itinéraire</a>':'')+'<select data-id="'+e(x.id)+'" aria-label="Suivi">'+ST.map(z=>'<option'+(z===S(x)?' selected':'')+'>'+z+'</option>').join('')+'</select></div>';
const card=x=>'<article class="card"><div class="hd"><span class="tag">'+tag(x)+'</span>'+cd(x)+'</div><h3>'+e(x.name)+'</h3><div class="chips">'+chips(x)+'</div><p class="d">'+dd(x)+'</p>'+(x.rem?'<p class="rem">'+e(x.rem)+'</p>':'')+fiche(x)+acts(x)+'</article>';
const hero=x=>'<article class="hero"><span class="tag">'+tag(x)+'</span><div class="big"><b>'+x.n+'</b><span>'+(x.n<=1?'jour':'jours')+' avant la clôture</span></div><h2>'+e(x.name)+'</h2><p class="d">'+dd(x)+'</p><div class="chips">'+chips(x)+'</div>'+fiche(x).replace('<details>','<details open>')+acts(x)+'</article>';
function ics(L,name){const z=n=>String(n).padStart(2,'0'),o=new Date(),ts=o.getUTCFullYear()+z(o.getUTCMonth()+1)+z(o.getUTCDate())+'T'+z(o.getUTCHours())+z(o.getUTCMinutes())+z(o.getUTCSeconds())+'Z';
const es=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const ev=L.map(x=>{const d=x.dl.replace(/-/g,'');return ['BEGIN:VEVENT','UID:'+x.id+'@festivals-photo','DTSTAMP:'+ts,'DTSTART:'+d+'T090000','DTEND:'+d+'T100000','SUMMARY:'+es('Clôture : '+x.name),'DESCRIPTION:'+es('Date approximative issue du tableur, à vérifier sur '+(x.url||'le site officiel')),...['-P7D','-P2D','PT0S'].map(t=>'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Clôture\r\nTRIGGER:'+t+'\r\nEND:VALARM'),'END:VEVENT'].join('\r\n')}).join('\r\n');
const b=new Blob(['BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//festivals-photo//FR\r\nCALSCALE:GREGORIAN\r\n'+ev+'\r\nEND:VCALENDAR\r\n'],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}

const live=x=>x.n!=null&&x.n>=0&&!x.inv&&!DONE.includes(S(x));
let tab='week',F={kind:'all',theme:'all',free:false,mins:0,s:''};
const M=q('#m');
function week(){const W=D.filter(x=>live(x)&&x.n<=7).sort((a,b)=>a.n-b.n),N=D.filter(x=>live(x)&&x.n>7&&x.n<=30).sort((a,b)=>a.n-b.n);
let h='<h1>Cette semaine</h1><p class="lead">'+(W.length?W.length+' clôture'+(W.length>1?'s':'')+' à ne pas rater.':'Rien à envoyer dans les 7 jours.')+'</p>';
if(W.length){h+=hero(W[0])+W.slice(1).map(card).join('')}else{const nx=D.filter(live).sort((a,b)=>a.n-b.n)[0];h+='<div class="empty">'+(nx?'Prochaine clôture : '+e(nx.name)+' dans '+nx.n+' jours.':'Tout est à jour.')+'</div>'}
if(N.length)h+='<h2 class="s">Dans les 30 jours</h2>'+N.map(card).join('');
if(W.length+N.length)h+='<div class="row"><button class="btn pri" id="exp">Ajouter ces '+(W.length+N.length)+' clôtures à mon agenda</button></div>';
M.innerHTML=h+'<p class="note">Dates approximatives (le tableur donne des semaines) : confirmez sur le site officiel.</p>';const b=q('#exp');if(b)b.onclick=()=>ics(W.concat(N),'declic-rappels.ics')}
const res=()=>{const s=F.s.trim().toLowerCase();return D.filter(x=>!x.inv&&(x.n==null||x.n>=0)&&(F.kind==='all'||(F.kind==='contest')===(x.kind==='contest'))&&(F.theme==='all'||x.theme===F.theme)&&(!F.free||x.pay==='Gratuit')&&(!F.mins||x.mins==null||x.mins<=F.mins)&&(!s||(x.name+' '+x.meta+' '+x.rem).toLowerCase().includes(s))).sort((a,b)=>(a.n==null)-(b.n==null)||a.n-b.n)};
function disc(){if(!q('#res')){M.innerHTML='<h1>Découvrir</h1><p class="lead">Concours et festivals de photo nature.</p><div class="row" style="margin:0 0 14px"><button class="btn" data-prop="1">Proposer un concours ou un festival</button></div><input class="srch" id="srch" type="search" placeholder="Rechercher un concours ou une ville" aria-label="Rechercher"><div class="seg" id="sk"></div><div class="rail" id="rail"></div><div id="res"></div>';q('#srch').oninput=ev=>{F.s=ev.target.value;discList()}}
const ks=[['all','Tout'],['contest','Concours'],['fest','Festivals']];q('#sk').innerHTML=ks.map(k=>'<button data-k="'+k[0]+'" aria-pressed="'+(F.kind===k[0])+'">'+k[1]+'</button>').join('');
q('#rail').innerHTML='<button data-free="1" aria-pressed="'+F.free+'">Gratuit</button>'+(home?'<button data-mn="180" aria-pressed="'+(F.mins===180)+'">Moins de 3 h</button>':'')+['all'].concat(uni(D.filter(x=>x.kind==='contest').map(x=>x.theme)).sort()).map(t=>'<button data-th="'+e(t)+'" aria-pressed="'+(F.theme===t)+'">'+(t==='all'?'Tous les thèmes':e(t))+'</button>').join('');discList()}
function discList(){const L=res();q('#res').innerHTML=(L.length?'<p class="sub tag" style="margin:0 0 12px">'+L.length+' résultat'+(L.length>1?'s':'')+'</p>'+L.map(card).join(''):'<div class="empty">Aucun résultat. Essayez un autre thème ou retirez un filtre.</div>')}
function mine(){const L=D.filter(x=>S(x)!=='Pas suivi');let h='<h1>Mes candidatures</h1><p class="lead">'+(L.length?L.length+' suivie'+(L.length>1?'s':'')+'.':'Rien à suivre pour l’instant.')+'</p>';
if(!L.length)h+='<div class="empty">Choisissez un statut sur une carte (À faire, Préparé…) pour la retrouver ici.</div>';
ST.slice(1).forEach(s=>{const G=L.filter(x=>S(x)===s);if(G.length)h+='<h2 class="s">'+s+' ('+G.length+')</h2>'+G.sort((a,b)=>(a.n==null)-(b.n==null)||a.n-b.n).map(card).join('')});M.innerHTML=h}
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t?'page':'false'));if(t!=='disc'||!q('#res'))window.scrollTo(0,0);(t==='week'?week:t==='disc'?disc:mine)()}
document.addEventListener('click',ev=>{const t=ev.target,d=t.dataset||{};if(d.t)return go(d.t);if(d.ics){const x=D.find(y=>y.id===d.ics);if(x)ics([x],'rappel-'+x.id+'.ics');return}
if(d.k!==undefined){F.kind=d.k;disc()}if(d.free){F.free=!F.free;disc()}if(d.th){F.theme=d.th;disc()}if(d.mn){F.mins=F.mins===+d.mn?0:+d.mn;disc()}if(d.city)openCity();if(d.prop)q('#dp').showModal();if(d.pick){home=JSON.parse(d.pick);try{localStorage.setItem('dc-home',d.pick)}catch(x){}prep();q('#dc').close();go(tab)}if(d.send)send();if(d.close)t.closest('dialog').close()});
document.addEventListener('change',ev=>{const id=ev.target.dataset&&ev.target.dataset.id;if(id){st[id]=ev.target.value==='Pas suivi'?undefined:ev.target.value;if(!st[id])delete st[id];save();const y=window.scrollY;go(tab);window.scrollTo(0,y)}});
function openCity(){q('#dc').showModal();q('#ci').focus()}
let tm;q('#ci').oninput=ev=>{clearTimeout(tm);const v=ev.target.value.trim();if(v.length<2){q('#cl').innerHTML='';return}tm=setTimeout(()=>fetch('https://geo.api.gouv.fr/communes?nom='+encodeURIComponent(v)+'&fields=nom,centre,codesPostaux&boost=population&limit=5').then(r=>r.json()).then(L=>{q('#cl').innerHTML=L.filter(c=>c.centre).map(c=>'<button type="button" class="btn pick" data-pick="'+e(JSON.stringify({name:c.nom,lat:c.centre.coordinates[1],lon:c.centre.coordinates[0]}))+'">'+e(c.nom)+' ('+e((c.codesPostaux||[''])[0])+')</button>').join('')||'<p class="rem">Aucune ville trouvée.</p>'}).catch(()=>{q('#cl').innerHTML='<p class="rem">Une connexion est nécessaire pour chercher une ville.</p>'}),250)};
q('#dc').onclose=()=>{if(q('#dc').returnValue==='skip'){try{localStorage.setItem('dc-skip','1')}catch(x){}}};
function send(){const g=i=>q('#'+i).value.trim();if(!g('pn')){q('#pn').focus();return}
const sub='Proposition Déclic : '+g('pn'),body=['Nom : '+g('pn'),'Type : '+g('pt'),'Site web : '+g('pu'),'Date limite : '+g('pd'),'Thème : '+g('pth'),'Prix : '+g('pp'),'Remarques : '+g('pr')].join('\n');
if(CFG.contact_email)location.href='mailto:'+CFG.contact_email+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
else if(CFG.repo)window.open('https://github.com/'+CFG.repo+'/issues/new?title='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body),'_blank');
else{try{navigator.clipboard.writeText(sub+'\n'+body)}catch(x){}alert('Texte copié. Envoyez-le à l’équipe Déclic.')}q('#dp').close()}
fetch('data.json').then(r=>r.json()).then(j=>{CFG=j.config||{};D=j.items;prep();go('week');let sk=0;try{sk=localStorage.getItem('dc-skip')}catch(x){}if(!home&&!sk)openCity()}).catch(()=>{M.innerHTML='<div class="empty">Impossible de charger les données. Vérifiez votre connexion.</div>'});
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
