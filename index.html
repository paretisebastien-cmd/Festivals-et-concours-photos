return '<details><summary>Fiche pratique</summary><dl>'+r.map(a=>'<dt>'+e(a[0])+'</dt><dd>'+e(a[1])+'</dd>').join('')+'</dl></details>'};

const acts=x=>'<div class="row">'+(x.d&&x.n>=0?'<button class="btn" data-ics="'+e(x.id)+'">Rappel</button>':'')+(x.url?'<a class="lnk" href="'+e(x.url)+'" target="_blank" rel="noopener">Site officiel</a>':'')+(x.route?'<a class="lnk" href="'+e(x.route)+'" target="_blank" rel="noopener">Itinéraire</a>':'')+'<select data-id="'+e(x.id)+'" aria-label="Suivi">'+ST.map(z=>'<option'+(z===S(x)?' selected':'')+'>'+z+'</option>').join('')+'</select></div>';
const card=x=>'<article class="card"><div class="hd"><span class="tag">'+tag(x)+'</span>'+cd(x)+'</div><h3>'+e(x.name)+'</h3><div class="chips">'+chips(x)+'</div><p class="d">'+dd(x)+'</p>'+(x.rem?'<p class="rem">'+e(x.rem)+'</p>':'')+fiche(x)+acts(x)+'</article>';
const hero=x=>'<article class="hero"><span class="tag">'+tag(x)+'</span><div class="big"><b>'+x.n+'</b><span>'+(x.n<=1?'jour':'jours')+' avant la clôture</span></div><h2>'+e(x.name)+'</h2><p class="d">'+dd(x)+'</p><div class="chips">'+chips(x)+'</div>'+fiche(x).replace('<details>','<details open>')+acts(x)+'</article>';
function ics(L,name){const z=n=>String(n).padStart(2,'0'),o=new Date(),ts=o.getUTCFullYear()+z(o.getUTCMonth()+1)+z(o.getUTCDate())+'T'+z(o.getUTCHours())+z(o.getUTCMinutes())+z(o.getUTCSeconds())+'Z';
const es=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const ev=L.map(x=>{const d=x.dl.replace(/-/g,'');return ['BEGIN:VEVENT','UID:'+x.id+'@festivals-photo','DTSTAMP:'+ts,'DTSTART:'+d+'T090000','DTEND:'+d+'T100000','SUMMARY:'+es('Clôture : '+x.name),'DESCRIPTION:'+es('Date approximative issue du tableur, à vérifier sur '+(x.url||'le site officiel')),...['-P7D','-P2D','PT0S'].map(t=>'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Clôture\r\nTRIGGER:'+t+'\r\nEND:VALARM'),'END:VEVENT'].join('\r\n')}).join('\r\n');
const b=new Blob(['BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//festivals-photo//FR\r\nCALSCALE:GREGORIAN\r\n'+ev+'\r\nEND:VCALENDAR\r\n'],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}

const live=x=>x.n!=null&&x.n>=0&&!x.inv&&!DONE.includes(S(x));
let tab='week',F={kind:'all',theme:'all',free:false,s:''};
const M=q('#m');
function week(){const W=D.filter(x=>live(x)&&x.n<=7).sort((a,b)=>a.n-b.n),N=D.filter(x=>live(x)&&x.n>7&&x.n<=30).sort((a,b)=>a.n-b.n);
let h='<h1>Cette semaine</h1><p class="lead">'+(W.length?W.length+' clôture'+(W.length>1?'s':'')+' à ne pas rater.':'Rien à envoyer dans les 7 jours.')+'</p>';
if(W.length){h+=hero(W[0])+W.slice(1).map(card).join('')}else{const nx=D.filter(live).sort((a,b)=>a.n-b.n)[0];h+='<div class="empty">'+(nx?'Prochaine clôture : '+e(nx.name)+' dans '+nx.n+' jours.':'Tout est à jour.')+'</div>'}
if(N.length)h+='<h2 class="s">Dans les 30 jours</h2>'+N.map(card).join('');
if(W.length+N.length)h+='<div class="row"><button class="btn pri" id="exp">Ajouter ces '+(W.length+N.length)+' clôtures à mon agenda</button></div>';
M.innerHTML=h+'<p class="note">Dates approximatives (le tableur donne des semaines) : confirmez sur le site officiel.</p>';const b=q('#exp');if(b)b.onclick=()=>ics(W.concat(N),'declic-rappels.ics')}
const res=()=>{const s=F.s.trim().toLowerCase();return D.filter(x=>!x.inv&&(x.n==null||x.n>=0)&&(F.kind==='all'||(F.kind==='contest')===(x.kind==='contest'))&&(F.theme==='all'||x.theme===F.theme)&&(!F.free||x.pay==='Gratuit')&&(!s||(x.name+' '+x.meta+' '+x.rem).toLowerCase().includes(s))).sort((a,b)=>(a.n==null)-(b.n==null)||a.n-b.n)};
function disc(){if(!q('#res')){M.innerHTML='<h1>Découvrir</h1><p class="lead">Concours et festivals de photo nature.</p><input class="srch" id="srch" type="search" placeholder="Rechercher un concours ou une ville" aria-label="Rechercher"><div class="seg" id="sk"></div><div class="rail" id="rail"></div><div id="res"></div>';q('#srch').oninput=ev=>{F.s=ev.target.value;discList()}}
const ks=[['all','Tout'],['contest','Concours'],['fest','Festivals']];q('#sk').innerHTML=ks.map(k=>'<button data-k="'+k[0]+'" aria-pressed="'+(F.kind===k[0])+'">'+k[1]+'</button>').join('');
q('#rail').innerHTML='<button data-free="1" aria-pressed="'+F.free+'">Gratuit</button>'+['all'].concat(uni(D.filter(x=>x.kind==='contest').map(x=>x.theme)).sort()).map(t=>'<button data-th="'+e(t)+'" aria-pressed="'+(F.theme===t)+'">'+(t==='all'?'Tous les thèmes':e(t))+'</button>').join('');discList()}
function discList(){const L=res();q('#res').innerHTML=(L.length?'<p class="sub tag" style="margin:0 0 12px">'+L.length+' résultat'+(L.length>1?'s':'')+'</p>'+L.map(card).join(''):'<div class="empty">Aucun résultat. Essayez un autre thème ou retirez un filtre.</div>')}
function mine(){const L=D.filter(x=>S(x)!=='Pas suivi');let h='<h1>Mes candidatures</h1><p class="lead">'+(L.length?L.length+' suivie'+(L.length>1?'s':'')+'.':'Rien à suivre pour l’instant.')+'</p>';
if(!L.length)h+='<div class="empty">Choisissez un statut sur une carte (À faire, Préparé…) pour la retrouver ici.</div>';
ST.slice(1).forEach(s=>{const G=L.filter(x=>S(x)===s);if(G.length)h+='<h2 class="s">'+s+' ('+G.length+')</h2>'+G.sort((a,b)=>(a.n==null)-(b.n==null)||a.n-b.n).map(card).join('')});M.innerHTML=h}
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t?'page':'false'));if(t!=='disc'||!q('#res'))window.scrollTo(0,0);(t==='week'?week:t==='disc'?disc:mine)()}
document.addEventListener('click',ev=>{const t=ev.target,d=t.dataset||{};if(d.t)return go(d.t);if(d.ics){const x=D.find(y=>y.id===d.ics);if(x)ics([x],'rappel-'+x.id+'.ics');return}
if(d.k!==undefined){F.kind=d.k;disc()}if(d.free){F.free=!F.free;disc()}if(d.th){F.theme=d.th;disc()}});
document.addEventListener('change',ev=>{const id=ev.target.dataset&&ev.target.dataset.id;if(id){st[id]=ev.target.value==='Pas suivi'?undefined:ev.target.value;if(!st[id])delete st[id];save();const y=window.scrollY;go(tab);window.scrollTo(0,y)}});
go('week');if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
